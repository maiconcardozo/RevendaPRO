services:
  database:
    image: mariadb:11.8
    container_name: revenda-pro-database
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - revendapro_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/RevendaPro.Global.Api/Dockerfile
    container_name: revenda-pro-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RevendaPro__ConnectionString: server=database;port=3306;database=${MARIADB_DATABASE};user=root;password=${MARIADB_ROOT_PASSWORD}
      RevendaPro__PilotTenant: Revenda Piloto
      RevendaPro__AdminEmail: ${REVENDAPRO_ADMIN_EMAIL}
      RevendaPro__AdminPassword: ${REVENDAPRO_ADMIN_PASSWORD}
      RevendaPro__PhotoFolder: /app/files/photos
      Jwt__Key: ${REVENDAPRO_JWT_KEY}
      Jwt__Issuer: RevendaPro
      Jwt__Audience: RevendaPro.Frontend
      Cors__Origins__0: http://localhost:3100
    volumes:
      - revendapro_files:/app/files
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:5100:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: revenda-pro-frontend
    environment:
      # Consumed by the Next route handlers, which run on the server inside the compose
      # network. The browser never calls the API directly.
      INTERNAL_API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

volumes:
  revendapro_mariadb:
  revendapro_files:
