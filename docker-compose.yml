services:
  database:
    image: mariadb:11.8
    container_name: revenda-pro-database
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - revendapro_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped


  # Armazenamento de arquivo, falando a API do S3. Em producao o mesmo codigo aponta para o
  # Cloudflare R2, trocando so configuracao. Ver ADR-0004.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: revenda-pro-storage
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      # 9100 e o endereco que o NAVEGADOR usa. A API fala com minio:9000, dentro da rede do
      # compose - por isso ServiceUrl e PublicUrl sao configuracoes separadas.
      - "127.0.0.1:9100:9000"
      # Console de administracao, util para conferir o que subiu.
      - "127.0.0.1:9101:9101"
    volumes:
      - revendapro_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: src/RevendaPro.Api/Dockerfile
    container_name: revenda-pro-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RevendaPro__ConnectionString: server=database;port=3306;database=${MARIADB_DATABASE};user=root;password=${MARIADB_ROOT_PASSWORD}
      RevendaPro__PilotTenant: Revenda Piloto
      RevendaPro__AdminEmail: ${REVENDAPRO_ADMIN_EMAIL}
      RevendaPro__AdminPassword: ${REVENDAPRO_ADMIN_PASSWORD}
      # Usuarios de demonstracao. Ligado apenas nesta pilha de desenvolvimento.
      RevendaPro__SeedDemoUsers: "true"
      RevendaPro__DemoPassword: ${REVENDAPRO_DEMO_PASSWORD}
      # Armazenamento. O fornecedor e configuracao: aqui MinIO, em producao Cloudflare R2.
      Storage__ServiceUrl: http://minio:9000
      Storage__PublicUrl: http://localhost:9100
      Storage__Region: us-east-1
      Storage__ForcePathStyle: "true"
      Storage__PublicBucket: revendapro-public
      Storage__PrivateBucket: revendapro-private
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__CreateBucketsOnStartup: "true"
      Jwt__Key: ${REVENDAPRO_JWT_KEY}
      Jwt__Issuer: RevendaPro
      Jwt__Audience: RevendaPro.Frontend
      Cors__Origins__0: http://localhost:3100
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:5100:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: revenda-pro-frontend
    environment:
      # Consumed by the Next route handlers, which run on the server inside the compose
      # network. The browser never calls the API directly.
      INTERNAL_API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # Backup do banco para o bucket, uma vez por dia, com retencao. Restaurar e
  # "docker compose run --rm backup restore.sh latest" - ver docs/operations/backup.md.
  # O mesmo container fala com o R2 quando publicar: troca-se STORAGE_SERVICE_URL e as chaves.
  backup:
    build:
      context: ./ops/backup
    container_name: revenda-pro-backup
    environment:
      DB_HOST: database
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      STORAGE_SERVICE_URL: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BACKUP_BUCKET: revendapro-backup
      # 06:00 UTC = 03:00 em Brasilia. Fora do horario em que alguem esta lancando gasto.
      BACKUP_HOUR_UTC: "06"
      BACKUP_ON_START: "1"
      BACKUP_KEEP_DAILY_DAYS: "30"
      BACKUP_KEEP_MONTHLY_DAYS: "365"
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  revendapro_mariadb:
  revendapro_storage:
